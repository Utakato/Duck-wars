<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Duck Wars - local simulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { height: 100%; margin: 0; background: #0d1220; color: #dfe6f5; font: 14px/1.3 system-ui, sans-serif; overflow: hidden; }
    #bar { height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: #151c30; border-bottom: 1px solid #263150; box-sizing: border-box; }
    #bar b { margin-right: 8px; color: #ffd23f; }
    #bar span.sep { flex: 1; }
    button { background: #26335a; color: #fff; border: 1px solid #3b4b7e; border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; }
    button:hover { background: #32437a; }
    button.on { background: #b81f3a; border-color: #ff5964; }
    label { display: flex; align-items: center; gap: 6px; opacity: 0.85; }
    input[type=number] { width: 64px; background: #0d1220; color: #fff; border: 1px solid #3b4b7e; border-radius: 6px; padding: 4px 6px; font: inherit; }
    #stage { position: absolute; left: 0; right: 0; top: 44px; bottom: 0; display: flex; }
    #screen-wrap { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; padding: 10px; box-sizing: border-box; position: relative; }
    #screen-box { position: relative; width: 100%; max-height: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
    #screen-box iframe { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border: 0; }
    #veil { position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: none; align-items: center; justify-content: center; background: rgba(5,8,16,.72); font-size: 32px; font-weight: 700; letter-spacing: .1em; pointer-events: none; }
    #veil.on { display: flex; }
    #phones { flex: 0 0 400px; overflow-y: auto; padding: 10px; box-sizing: border-box; border-left: 1px solid #263150; display: flex; flex-direction: column; gap: 10px; }
    body.hide-phones #phones { flex-basis: 0; padding: 0; border: 0; overflow: hidden; }
    .phone { background: #151c30; border: 1px solid #263150; border-radius: 12px; padding: 6px; }
    .phone.focus { border-color: #ffd23f; }
    .phone .head { display: flex; align-items: center; gap: 6px; padding: 0 4px 6px; }
    .phone .head span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .phone .head button { padding: 2px 8px; }
    .phone .frame { position: relative; width: 100%; aspect-ratio: 19.5 / 9; border-radius: 8px; overflow: hidden; background: #000; }
    .phone iframe { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border: 0; }
    .phone.buzz { animation: buzz .25s linear; }
    @keyframes buzz { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
    #help { position: absolute; left: 14px; bottom: 8px; font-size: 12px; opacity: .6; pointer-events: none; }
  </style>
</head>
<body>
  <div id="bar">
    <b>Duck Wars local simulator</b>
    <button id="add">+ Phone</button>
    <button id="pause">Pause</button>
    <label><input type="checkbox" id="ads" checked> show ad breaks</label>
    <label>latency <input type="number" id="latency" value="0" min="0" max="2000" step="20"> ms</label>
    <span class="sep"></span>
    <span id="info"></span>
  </div>
  <div id="stage">
    <div id="screen-wrap">
      <div id="screen-box"><div id="veil"></div></div>
      <div id="help">Click a phone, then: WASD / arrows paddle, Space fire, Shift dive, Q quack, Enter start. This page stands in for the AirConsole platform; it runs the real API file.</div>
    </div>
    <div id="phones"></div>
  </div>
  <script src="harness.js"></script>
</body>
</html>
